name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check read-only runtime contract
        run: python tools/check_readonly_contract.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-centralizado/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          CAPITAL_MODE: DEMO
        run: python -m pytest tests -q
